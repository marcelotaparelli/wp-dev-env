services:
  db:
    image: mysql:8.0
    container_name: wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0-php8.3-apache
    container_name: wp_site
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: 1
    volumes:
      # Só o wp-content é montado do host: é a única parte que
      # precisa ir para o servidor final (tema, plugins, uploads).
      # O core do WordPress fica isolado dentro do container.
      - ./wp-content:/var/www/html/wp-content

  wpcli:
    image: wordpress:cli-php8.3
    container_name: wp_cli
    depends_on:
      - db
      - wordpress
    volumes:
      - ./wp-content:/var/www/html/wp-content
    working_dir: /var/www/html
    entrypoint: ["wp"]

volumes:
  db_data: